<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>ConfluenceX — Offline</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#070a12" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="ConfluenceX" />
    <link rel="icon" type="image/svg+xml" href="/confluencex-mark.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <style>
      :root { color-scheme: dark; }
      html, body { margin: 0; padding: 0; height: 100%; background: #070a12; color: #e2e8f0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; -webkit-font-smoothing: antialiased; }
      .wrap { display: flex; min-height: 100%; align-items: center; justify-content: center; padding: 24px; }
      .card { position: relative; max-width: 420px; width: 100%; border-radius: 28px; padding: 36px 28px; text-align: center; background: linear-gradient(180deg, rgba(17,24,45,0.85) 0%, rgba(7,10,18,0.95) 100%); border: 1px solid rgba(148,163,184,0.18); box-shadow: 0 30px 80px rgba(15,23,42,0.6); overflow: hidden; }
      .card::before { content: ""; position: absolute; inset: -40% -20% auto auto; height: 320px; width: 320px; background: radial-gradient(circle, rgba(139,92,246,0.35), transparent 70%); filter: blur(40px); pointer-events: none; }
      .card::after  { content: ""; position: absolute; inset: auto auto -40% -20%; height: 320px; width: 320px; background: radial-gradient(circle, rgba(34,211,238,0.28), transparent 70%); filter: blur(40px); pointer-events: none; }
      .mark { width: 112px; height: 112px; margin: 0 auto 18px; filter: drop-shadow(0 0 24px rgba(139,92,246,0.45)); animation: pulse 2.8s ease-in-out infinite; }
      h1 { margin: 0 0 6px; font-size: 26px; font-weight: 800; letter-spacing: -0.02em; color: #fff; }
      h1 span { background: linear-gradient(90deg, #67e8f9, #a78bfa, #f0abfc); -webkit-background-clip: text; background-clip: text; color: transparent; }
      .tag { font-size: 10px; font-weight: 800; letter-spacing: 0.32em; text-transform: uppercase; color: #67e8f9; }
      p { margin: 14px auto 0; max-width: 32ch; color: #94a3b8; line-height: 1.55; font-size: 15px; }
      .actions { margin-top: 28px; display: flex; flex-direction: column; gap: 10px; }
      .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 14px 18px; border-radius: 14px; font-weight: 700; font-size: 15px; cursor: pointer; border: 0; text-decoration: none; transition: transform 0.15s ease, box-shadow 0.15s ease; min-height: 48px; }
      .btn-primary { color: #070a12; background: linear-gradient(90deg, #67e8f9, #a78bfa, #f0abfc); box-shadow: 0 0 30px rgba(139,92,246,0.35); }
      .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 0 40px rgba(139,92,246,0.45); }
      .btn-secondary { color: #e2e8f0; background: rgba(148,163,184,0.08); border: 1px solid rgba(148,163,184,0.25); }
      .btn-secondary:hover { background: rgba(148,163,184,0.14); }
      .status { margin-top: 22px; font-size: 12px; color: #64748b; letter-spacing: 0.02em; }
      .status .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #f43f5e; margin-right: 6px; vertical-align: middle; box-shadow: 0 0 0 0 rgba(244,63,94,0.5); animation: ring 1.6s ease-out infinite; }
      @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.04); } }
      @keyframes ring { 0% { box-shadow: 0 0 0 0 rgba(244,63,94,0.6); } 70% { box-shadow: 0 0 0 10px rgba(244,63,94,0); } 100% { box-shadow: 0 0 0 0 rgba(244,63,94,0); } }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="card" role="alert" aria-live="polite">
        <svg class="mark" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <defs>
            <linearGradient id="obg" x1="12" y1="8" x2="116" y2="120" gradientUnits="userSpaceOnUse">
              <stop stop-color="#11182D"/><stop offset="1" stop-color="#070A12"/>
            </linearGradient>
            <linearGradient id="ov" x1="24" y1="22" x2="98" y2="104" gradientUnits="userSpaceOnUse">
              <stop stop-color="#D946EF"/><stop offset="0.48" stop-color="#8B5CF6"/><stop offset="1" stop-color="#6D28D9"/>
            </linearGradient>
            <linearGradient id="oc" x1="104" y1="20" x2="28" y2="108" gradientUnits="userSpaceOnUse">
              <stop stop-color="#67E8F9"/><stop offset="0.5" stop-color="#22D3EE"/><stop offset="1" stop-color="#0891B2"/>
            </linearGradient>
          </defs>
          <rect x="4" y="4" width="120" height="120" rx="30" fill="url(#obg)" stroke="#26304D" stroke-width="2"/>
          <path d="M24 30L47 50L62 64L82 83L104 103" fill="none" stroke="url(#ov)" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M104 25L83 45L65 62L46 82L24 104" fill="none" stroke="url(#oc)" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M16 64H40M88 64H112" stroke="#33405F" stroke-width="3" stroke-linecap="round"/>
          <circle cx="64" cy="64" r="11" fill="#0B1020" stroke="#F5F3FF" stroke-width="2"/>
          <path d="M57 64L62 69L72 57" fill="none" stroke="#A3E635" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <div class="tag">Offline mode</div>
        <h1>You're <span>offline</span></h1>
        <p>Live market data and AI explanations need a connection. Charts you opened earlier are still cached and will reopen when you're back online.</p>
        <div class="actions">
          <button class="btn btn-primary" onclick="window.location.reload()">Try again</button>
          <a class="btn btn-secondary" href="/">Open cached dashboard</a>
        </div>
        <div class="status"><span class="dot" id="netDot"></span><span id="netText">Waiting for connection…</span></div>
      </div>
    </div>
    <script>
      // Tiny status indicator — flips green the moment connectivity returns.
      (function () {
        var dot = document.getElementById('netDot');
        var txt = document.getElementById('netText');
        function set(online) {
          if (!dot || !txt) return;
          dot.style.background = online ? '#22c55e' : '#f43f5e';
          txt.textContent = online ? 'Back online — tap Try again' : 'Waiting for connection…';
        }
        set(navigator.onLine);
        window.addEventListener('online',  function () { set(true);  window.location.reload(); });
        window.addEventListener('offline', function () { set(false); });
      })();
    </script>
  </body>
</html>
