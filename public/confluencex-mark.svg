<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">
  <title id="title">ConfluenceX mark</title>
  <desc id="desc">Four market paths converge into an illuminated X</desc>
  <defs>
    <linearGradient id="bg" x1="12" y1="8" x2="116" y2="120" gradientUnits="userSpaceOnUse">
      <stop stop-color="#11182D"/>
      <stop offset="1" stop-color="#070A12"/>
    </linearGradient>
    <linearGradient id="violet" x1="24" y1="22" x2="98" y2="104" gradientUnits="userSpaceOnUse">
      <stop stop-color="#D946EF"/>
      <stop offset="0.48" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#6D28D9"/>
    </linearGradient>
    <linearGradient id="cyan" x1="104" y1="20" x2="28" y2="108" gradientUnits="userSpaceOnUse">
      <stop stop-color="#67E8F9"/>
      <stop offset="0.5" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#0891B2"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="4" y="4" width="120" height="120" rx="30" fill="url(#bg)" stroke="#26304D" stroke-width="2"/>
  <path d="M24 30L47 50L62 64L82 83L104 103" fill="none" stroke="url(#violet)" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M104 25L83 45L65 62L46 82L24 104" fill="none" stroke="url(#cyan)" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M16 64H40M88 64H112" stroke="#33405F" stroke-width="3" stroke-linecap="round"/>
  <circle cx="64" cy="64" r="11" fill="#0B1020" stroke="#F5F3FF" stroke-width="2" filter="url(#glow)"/>
  <path d="M57 64L62 69L72 57" fill="none" stroke="#A3E635" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
