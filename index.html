    <!--
      Inline native splash. Paints immediately on cold start before CSS/JS load
      so there is no white flash between the native launch screen and the React
      tree. Mirrors the PwaSplash background (#070a12 + violet glow).
    -->
    <style>
      html, body { margin: 0; padding: 0; background: #070a12; color: #e2e8f0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
      #cx-boot { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
        background: #070a12; z-index: 9999; transition: opacity 240ms ease; }
      #cx-boot::before { content: ""; position: absolute; inset: 0;
        background: radial-gradient(circle at 18% 8%, rgba(34,211,238,0.18), transparent 28%),
                    radial-gradient(circle at 82% 12%, rgba(139,92,246,0.22), transparent 32%),
                    radial-gradient(circle at 50% 100%, rgba(217,70,239,0.10), transparent 38%); }
      #cx-boot svg { width: 112px; height: 112px; filter: drop-shadow(0 0 28px rgba(139,92,246,0.45)); animation: cx-boot-pulse 2.8s ease-in-out infinite; position: relative; z-index: 1; }
      #cx-boot .word { position: relative; z-index: 1; margin-top: 18px; font-weight: 800; letter-spacing: -0.02em; font-size: 26px; color: #fff; }
      #cx-boot .word span { background: linear-gradient(90deg,#67e8f9,#a78bfa,#f0abfc); -webkit-background-clip: text; background-clip: text; color: transparent; }
      #cx-boot .tag { position: relative; z-index: 1; margin-top: 4px; font-size: 10px; font-weight: 800; letter-spacing: 0.32em; color: #67e8f9; text-transform: uppercase; }
      #cx-boot.hide { opacity: 0; pointer-events: none; }
      @keyframes cx-boot-pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.04); } }
    </style>

    <!-- Open Graph / Facebook -->

  <body>
    <div id="cx-boot" aria-hidden="true">
      <svg viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="boot-v" x1="24" y1="22" x2="98" y2="104" gradientUnits="userSpaceOnUse">
            <stop stop-color="#D946EF"/><stop offset="0.48" stop-color="#8B5CF6"/><stop offset="1" stop-color="#6D28D9"/>
          </linearGradient>
          <linearGradient id="boot-c" x1="104" y1="20" x2="28" y2="108" gradientUnits="userSpaceOnUse">
            <stop stop-color="#67E8F9"/><stop offset="0.5" stop-color="#22D3EE"/><stop offset="1" stop-color="#0891B2"/>
          </linearGradient>
          <linearGradient id="boot-bg" x1="12" y1="8" x2="116" y2="120" gradientUnits="userSpaceOnUse">
            <stop stop-color="#11182D"/><stop offset="1" stop-color="#070A12"/>
          </linearGradient>
        </defs>
        <rect x="4" y="4" width="120" height="120" rx="30" fill="url(#boot-bg)" stroke="#26304D" stroke-width="2"/>
        <path d="M24 30L47 50L62 64L82 83L104 103" fill="none" stroke="url(#boot-v)" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M104 25L83 45L65 62L46 82L24 104" fill="none" stroke="url(#boot-c)" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M16 64H40M88 64H112" stroke="#33405F" stroke-width="3" stroke-linecap="round"/>
        <circle cx="64" cy="64" r="11" fill="#0B1020" stroke="#F5F3FF" stroke-width="2"/>
        <path d="M57 64L62 69L72 57" fill="none" stroke="#A3E635" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <div class="word">Confluence<span>X</span></div>
      <div class="tag">See the Setup. Confirm the Edge.</div>
    </div>
    <div id="root"></div>
    <noscript>
      <div style="text-align: center; padding: 50px; font-family: Arial, sans-serif;">
        <h1>JavaScript Required</h1>
        <p>ConfluenceX requires JavaScript to function properly. Please enable JavaScript in your browser settings.</p>
      </div>
    </noscript>
    <script>
      // Fade out the inline boot splash once React has mounted the real tree.
      (function () {
        function dismissBoot() {
          var el = document.getElementById('cx-boot');
          if (!el) return;
          el.classList.add('hide');
          setTimeout(function () { if (el && el.parentNode) el.parentNode.removeChild(el); }, 280);
        }
        if (document.readyState === 'complete') {
          setTimeout(dismissBoot, 50);
        } else {
          window.addEventListener('load', function () { setTimeout(dismissBoot, 50); });
        }
        // Hard fallback: never block forever.
        setTimeout(dismissBoot, 4000);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
