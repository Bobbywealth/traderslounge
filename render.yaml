# Frontend Static Site
services:
  - type: web
    name: traderslounge
    env: node
    region: oregon
    plan: free
    rootDir: .
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: VITE_DATABASE_URL
        sync: false
      - key: VITE_PERPLEXITY_API_KEY
        sync: false
      - key: VITE_FINNHUB_API_KEY
        sync: false
      - key: VITE_API_URL
        value: https://traderslounge-api.onrender.com

# API Server
  - type: web
    name: traderslounge-api
    env: node
    region: oregon
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: PERPLEXITY_API_KEY
        sync: false
      - key: FINNHUB_API_KEY
        sync: false
